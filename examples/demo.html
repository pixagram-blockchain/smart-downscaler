<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smart-downscaler 1.0 demo</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #2f7d5b; }
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0 auto; padding: 20px; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; opacity: .75; }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 10px 12px; }
  legend { font-weight: 600; padding: 0 4px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
  label.check { justify-content: flex-start; }
  input[type=number], select { width: 120px; padding: 3px 6px; font: inherit; }
  input[type=range] { width: 120px; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; width: 100%; }
  button:disabled { opacity: .5; cursor: default; }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; opacity: .7; margin-bottom: 4px; }
  canvas { width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px;
           background: repeating-conic-gradient(#8883 0% 25%, transparent 0% 50%) 50% / 16px 16px; }
  #palette { display: flex; flex-wrap: wrap; gap: 3px; margin: 12px 0; }
  #palette span { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #status { margin: 8px 0; min-height: 1.4em; }
  #status.error { color: #c0392b; }
</style>
</head>
<body>
<h1>smart-downscaler <span id="version"></span></h1>
<p class="lead">Structure-preserving pixel-art downscaling in WebAssembly. Build the package first
(<code>./build-wasm.sh</code>) and serve this folder's parent over HTTP.</p>

<div class="layout">
  <div>
    <fieldset>
      <legend>Source</legend>
      <label>Image <input type="file" id="file" accept="image/*" style="width:150px"></label>
      <label>or chart
        <select id="chart">
          <option value="">(none)</option><option>portrait</option><option>illustration</option>
          <option>gradient</option><option>texture</option><option>pixel_art</option>
          <option>sprite</option><option>sprite_soft</option>
        </select></label>
    </fieldset>
    <fieldset>
      <legend>Output</legend>
      <label>Width <input type="number" id="width" value="64" min="1" max="1024"></label>
      <label>Colours <input type="number" id="colors" value="16" min="1" max="256"></label>
      <label>Fixed palette
        <select id="fixed"><option value="">(extract)</option><option>pico8</option><option>nes</option>
          <option>gameboy</option><option>cga</option><option>commodore64</option><option>apple2</option></select></label>
    </fieldset>
    <fieldset>
      <legend>Quality</legend>
      <label>Mode <select id="quality"><option>fast</option><option selected>balanced</option><option>high</option><option>maximum</option></select></label>
      <label>Engine <select id="engine"><option>pax</option><option>legacy</option></select></label>
      <label>Strategy <select id="strategy"></select></label>
    </fieldset>
    <fieldset>
      <legend>Compensation</legend>
      <label class="check"><input type="checkbox" id="chroma" checked> Chroma</label>
      <label class="check"><input type="checkbox" id="contrast" checked> Contrast</label>
      <label class="check"><input type="checkbox" id="luminosity" checked> Luminosity</label>
      <label>Strength <input type="range" id="strength" min="0" max="2" step="0.05" value="1"></label>
    </fieldset>
    <fieldset>
      <legend>Structure</legend>
      <label>Edges <input type="range" id="edges" min="0" max="1" step="0.05" value="0.8"></label>
      <label>Thin features <input type="range" id="thin" min="0" max="1" step="0.05" value="0.6"></label>
      <label>Coherence <input type="range" id="coherence" min="0" max="1" step="0.05" value="0.5"></label>
    </fieldset>
    <button id="run" disabled>Downscale</button>
    <div id="status">Loading WebAssembly…</div>
  </div>

  <div>
    <div class="views">
      <figure><figcaption id="srcCap">Source</figcaption><canvas id="src" width="8" height="8"></canvas></figure>
      <figure><figcaption id="outCap">Result</figcaption><canvas id="out" width="8" height="8"></canvas></figure>
    </div>
    <div id="palette"></div>
    <table id="diag"></table>
  </div>
</div>

<script type="module">
  // The wrapper and the generated bindings live side by side in pkg/web after ./build-wasm.sh.
  import * as sd from '../pkg/web/smart-downscaler.js';

  const $ = (id) => document.getElementById(id);
  const status = (text, error = false) => { $('status').textContent = text; $('status').className = error ? 'error' : ''; };
  let source = null;      // ImageData
  let prepared = null;    // reused while the source and the prepare-time settings stay the same
  let preparedKey = '';

  function setSource(imageData, label) {
    source = imageData;
    if (prepared) { prepared.free(); prepared = null; }
    $('src').width = imageData.width; $('src').height = imageData.height;
    $('src').getContext('2d').putImageData(imageData, 0, 0);
    $('srcCap').textContent = `Source — ${label} ${imageData.width}×${imageData.height}`;
    $('run').disabled = false;
  }

  $('file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const bitmap = await createImageBitmap(file);
    const c = new OffscreenCanvas(bitmap.width, bitmap.height);
    const ctx = c.getContext('2d');
    ctx.drawImage(bitmap, 0, 0);
    $('chart').value = '';
    setSource(ctx.getImageData(0, 0, c.width, c.height), file.name);
  });
  $('chart').addEventListener('change', () => {
    if ($('chart').value) setSource(sd.testChart($('chart').value, 256, 256), $('chart').value);
  });

  function run() {
    if (!source) return;
    const width = Math.max(1, +$('width').value | 0);
    const height = Math.max(1, Math.round(width * source.height / source.width));
    const options = {
      quality: $('quality').value,
      engine: $('engine').value,
      paletteStrategy: $('strategy').value,
      paletteSize: +$('colors').value,
      chromaCompensation: $('chroma').checked ? 'auto' : 'off',
      contrastCompensation: $('contrast').checked ? 'auto' : 'off',
      luminosityCompensation: $('luminosity').checked ? 'auto' : 'off',
      compensationStrength: +$('strength').value,
      edgePreservation: +$('edges').value,
      thinFeaturePreservation: +$('thin').value,
      spatialCoherence: +$('coherence').value,
    };
    try {
      // Quality and engine are fixed when the image is prepared; everything else is per call.
      const key = `${options.quality}/${options.engine}`;
      if (!prepared || key !== preparedKey) {
        if (prepared) prepared.free();
        prepared = sd.prepare(source, options);
        preparedKey = key;
      }
      const t0 = performance.now();
      const fixed = $('fixed').value;
      const r = fixed
        ? prepared.downscaleWithPalette(width, height, sd.getPresetPalette(fixed), options)
        : prepared.downscale(width, height, options);
      const ms = performance.now() - t0;
      $('out').width = r.width; $('out').height = r.height;
      $('out').getContext('2d').putImageData(r.imageData, 0, 0);
      $('outCap').textContent = `Result — ${r.width}×${r.height}, ${r.colorsUsed} colours, ${ms.toFixed(1)} ms`;
      $('palette').replaceChildren(...Array.from({ length: r.paletteSize }, (_, i) => {
        const s = document.createElement('span');
        const [R, G, B] = r.palette.subarray(i * 3, i * 3 + 3);
        s.style.background = `rgb(${R},${G},${B})`;
        s.title = '#' + [R, G, B].map((v) => v.toString(16).padStart(2, '0')).join('');
        return s;
      }));
      const d = r.diagnostics;
      const rows = d ? [
        ['Colourfulness (source → output)', `${d.source_colorfulness.toFixed(4)} → ${d.output_colorfulness.toFixed(4)}`],
        ['Contrast (source → output)', `${d.source_contrast.toFixed(4)} → ${d.output_contrast.toFixed(4)}`],
        ['Recovered: chroma / contrast / luminosity', [d.chroma_recovered, d.contrast_recovered, d.luminosity_recovered].map((v) => (100 * v).toFixed(0) + ' %').join(' / ')],
        ['Edge retention', d.edge_retention.toFixed(3)],
        ['Structural error', d.structural_error.toFixed(3)],
        ['Colour error (≈ ΔE; 0.02 is one JND)', d.color_error.toFixed(4)],
        ['Candidates per footprint', d.mean_candidates.toFixed(2)],
        ['Thin features kept / thinned', `${d.artifacts.features_kept} / ${d.artifacts.features_thinned}`],
        ['Isolated pixels removed / kept', `${d.artifacts.isolated_removed} / ${d.artifacts.isolated_kept}`],
        ['Digest', r.digest],
      ] : [['Diagnostics', 'not measured by the legacy engine'], ['Digest', r.digest]];
      $('diag').replaceChildren(...rows.map(([k, v]) => {
        const tr = document.createElement('tr');
        tr.append(Object.assign(document.createElement('td'), { textContent: k }), Object.assign(document.createElement('td'), { textContent: v }));
        return tr;
      }));
      status('Done.');
    } catch (err) {
      status(err.message, true);
    }
  }
  $('run').addEventListener('click', run);

  try {
    await sd.init();
    $('version').textContent = sd.version();
    for (const s of sd.getPaletteStrategies()) $('strategy').append(new Option(s, s));
    status('Ready. Load an image or pick a chart.');
    $('chart').value = 'portrait';
    setSource(sd.testChart('portrait', 256, 256), 'portrait');
    run();
  } catch (err) {
    status(`Could not load the WebAssembly package (run ./build-wasm.sh, then serve over HTTP): ${err.message}`, true);
  }
</script>
</body>
</html>
