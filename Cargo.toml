[package]
name = "smart-downscaler"
version = "1.0.1"
edition = "2021"
rust-version = "1.70"
authors = ["Pixagram"]
description = "Structure-preserving, perceptually optimised pixel-art downscaler: adaptive K-Centroid extraction, automatic palette compensation and artifact avoidance (Rust + WebAssembly)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/pixagram-blockchain/smart-downscaler"
keywords = ["pixel-art", "image-processing", "downscaling", "quantization", "wasm"]
categories = ["multimedia::images", "graphics", "wasm"]
exclude = ["pkg/", "target/", "docs/img/"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ordered-float = "4.2"

# Optional dependencies
image = { version = "0.24", optional = true }
rayon = { version = "1.5", optional = true }

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

[dev-dependencies]
criterion = "0.4"

[features]
default = ["native"]
# Native build: image I/O (CLI, `to_image`) + multi-threaded footprint extraction.
native = ["image", "parallel"]
# Rayon-based parallel footprint extraction. Output is identical with or without it.
parallel = ["rayon"]
# WebAssembly bindings (build with `--no-default-features --features wasm`).
wasm = ["wasm-bindgen", "js-sys", "web-sys"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "s"
lto = true

[[bin]]
name = "smart-downscaler"
path = "src/bin/smart-downscaler.rs"
required-features = ["native"]

[[example]]
name = "regression"
required-features = ["native"]

[[bench]]
name = "downscale_bench"
harness = false
